# Tag 触发的 GitHub 渠道发布：版本校验 + onedir zip 资产 + Release 正文。
# 版本号唯一来源 asr_voice/version.py，第一件事就是校 tag 与它一致。
# 发行渠道的打包与上传资产不随公开仓分发，一律在本地按内部发布手册手动执行；
# 这条边界由静态测试守卫，别把发行渠道 job 加回来。

name: Release

on:
  push:
    tags: ["v*"]

# action-gh-release 需要写权限。新仓库默认给 GITHUB_TOKEN 的 contents 是只读的，
# 不显式声明会以 403 结束——构建全绿、只有建 Release 那一步失败，错误信息不直观。
permissions:
  contents: write

jobs:
  version-check:
    name: Version check (tag == asr_voice/version.py)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 本 job 刻意不装依赖：check_version / changelog_top 只 import
      # asr_voice.version（其 __init__ 很轻，不需要 PySide6），几秒内就该有结论，
      # 不必为一次纯文本校验付 PySide6 的安装时间。
      - name: Verify tag matches code version
        run: python scripts/check_version.py ${{ github.ref_name }}
      # check_version 只比 tag 与代码版本，从不看 changelog——「忘了写 CHANGELOG 段」
      # 于是能一路过 CI，直到发布说明空掉才被发现。这条把顶部段也串进校验。
      - name: Verify CHANGELOG top section matches version
        run: python scripts/changelog_top.py --check

  github-release:
    name: GitHub Release (onedir zip)
    needs: version-check
    runs-on: windows-latest
    # secrets 不能直接写进 step 的 if（GitHub 会把整个 workflow 判为无效文件，
    # 报 "Unrecognized named-value: 'secrets'"，且**每次 push 都失败一次**，
    # 连 tag 都推不出去）。job 级 env 是允许读 secrets 的，先中转成开关再用。
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Generate version resource
        run: python scripts/gen_version_info.py
      - name: Build onedir bundle
        run: python -m PyInstaller --noconfirm openrealtimeasr-ui.spec
        env:
          ORI_BUILD_MODE: full
          # onefile 的 %TEMP% 解包被杀软启发式整机拦截（bootloader 报
          # Could not create temporary directory）；onedir 不解包、启发式面更小、
          # 启动更快。产物 dist\ORI\（ORI.exe + _internal\）。
          ORI_PACKAGE: onedir
      # 像素主题为渠道独占。GitHub 版在三处物理排除它：spec 的 datas/
      # hiddenimports/excludes、FusionPixel 字体、以及这一步。dist/ORI/themes 只是
      # 本地「外部主题包投放位」，两个包已随 onedir 打进 _internal/themes，故不上传。
      - name: Deploy theme packs (pixel excluded)
        run: python scripts/copy_github_themes.py dist/ORI/themes
      # Release 正文只取 CHANGELOG 顶部那一段，不是整个文件（历史版本不该跟着走）。
      - name: Extract release notes
        run: python scripts/changelog_top.py --out dist/RELEASE_NOTES.md
      # 签名走 SignPath（替代已废弃的 Azure Trusted Signing）：被签对象须先以
      # workflow artifact 存在（可信构建校验：origin 由 GitHub 提供、脚本伪造不了），
      # 顺序 = 上传 → 签 → 写回 → zip/校验和 → Release，反了会发未签名包。只配
      # ORI.exe；_internal 的上游 dll 允许分发、禁止用项目证书签；无 secrets 时跳过。
      - name: Upload unsigned bundle for signing
        id: upload-unsigned-artifact
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ori-unsigned-bundle
          path: dist/ORI
      - name: Sign bundle with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/ORI
      # onedir 产物是目录（ORI.exe + _internal\），Release 资产须单文件故 zip：
      # Compress-Archive 用 \* 把目录内容打在 zip 根，解压后 ORI.exe 直接在顶层，
      # 与 README「解压后双击即用」口径一致。
      - name: Package onedir bundle as zip
        run: Compress-Archive -Path dist\ORI\* -DestinationPath "dist\ORI-${{ github.ref_name }}-win64.zip"
      # 未签名产物是杀软启发式误报的高发组合：SHA256SUMS 是用户核对「下载产物
      # 未被篡改」的唯一手段（核对方法见 README「下载途径」），必须随每个 Release
      # 发布。行尾用 LF——CRLF 会让 GNU sha256sum -c 报「improperly formatted」。
      - name: Generate SHA256 checksums
        run: |
          $lines = Get-FileHash "dist/ORI-${{ github.ref_name }}-win64.zip", THIRD_PARTY_NOTICES.md -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ORI-${{ github.ref_name }}-win64.zip
            THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
